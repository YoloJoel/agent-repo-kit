name: Verify toolkit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  workflows:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the actual distribution
        run: python -m pip install .
      - name: Test consumer workflows using installed assets
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the installed entry points
        run: |
          ark --version
          python -m agent_repo_kit --help
