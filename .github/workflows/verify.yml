name: Verify toolkit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  workflows:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check native plugin and Skill artifacts match their sources
        run: python tools/build_native.py --check
      - name: Build and install the actual distribution
        run: python -m pip install .
      - name: Test consumer workflows using installed assets
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the installed entry points
        run: |
          ark --version
          python -m agent_repo_kit --help
  native-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and install the pinned Claude Marketplace release
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/ark-claude-config
          DISABLE_TELEMETRY: '1'
        run: |
          # Require the Ubuntu x64 binary package so npm reports installation failures.
          claude_install="$RUNNER_TEMP/ark-claude-code"
          claude_package="@anthropic-ai/claude-code-linux-x64"
          npm install --prefix "$claude_install" --no-save --no-audit --no-fund --ignore-scripts \
            "$claude_package@2.1.322"
          claude="$claude_install/node_modules/$claude_package/claude"
          "$claude" --version
          "$claude" plugin validate .claude-plugin/plugin.json --strict
          "$claude" plugin validate .claude-plugin/marketplace.json --strict
          mkdir -p "$RUNNER_TEMP/ark-claude-project"
          cd "$RUNNER_TEMP/ark-claude-project"
          "$claude" plugin marketplace add "$GITHUB_WORKSPACE" --scope project
          "$claude" plugin install agent-repo-kit@agent-repo-kit --scope project
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          config = Path(os.environ["CLAUDE_CONFIG_DIR"])
          expected = json.loads((root / ".claude-plugin/plugin.json").read_text())
          market = json.loads((root / ".claude-plugin/marketplace.json").read_text())
          release = next(p for p in market["plugins"] if p["name"] == expected["name"])
          registry = json.loads((config / "plugins/installed_plugins.json").read_text())
          key = expected["name"] + "@" + market["name"]
          record, = [p for p in registry["plugins"][key] if p["scope"] == "project"]
          installed = Path(record["installPath"])
          manifest = json.loads((installed / ".claude-plugin/plugin.json").read_text())
          scripts = installed / "skills/initialize-repo/scripts"
          bundle = json.loads((scripts / "resources.json").read_text())
          assert manifest["name"] == expected["name"], "installed plugin identity differs"
          assert expected["version"] == release["version"] == record["version"] == manifest["version"] == bundle["version"], "Marketplace/installed release lags the plugin version"
          assert record["gitCommitSha"] == release["source"]["sha"], "installed commit differs from the Marketplace pin"
          engine_sha = hashlib.sha256((scripts / "engine.py").read_bytes()).hexdigest()
          assert engine_sha == bundle["engine_sha256"], "installed engine differs from its bundle"
          subprocess.run([sys.executable, "-I", "-S", str(scripts / "initialize.py"), ".",
                          "--agents", "claude", "--no-hooks", "--ci", "none"], check=True)
          assert hashlib.sha256(Path("hack/ai/ark.py").read_bytes()).hexdigest() == engine_sha
          result = {"status": "PASS", "version": manifest["version"], "commit": record["gitCommitSha"],
                    "engine_sha256": engine_sha, "scope": record["scope"], "model_session": "NOT_RUN"}
          (Path(os.environ["RUNNER_TEMP"]) / "claude-marketplace-qualification.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          PY
      - name: Install standard Skills into an isolated project
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/ark-native-project"
          cd "$RUNNER_TEMP/ark-native-project"
          git init
          npx --yes skills@1.8.1 add "$GITHUB_WORKSPACE" --skill '*' --agent codex --copy --yes
          python -I -S .agents/skills/initialize-repo/scripts/initialize.py . --agents codex --no-hooks --ci none
      - name: Install through the documented remote Git-ref source
        env:
          DISABLE_TELEMETRY: '1'
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/ark-remote-project"
          cd "$RUNNER_TEMP/ark-remote-project"
          git init
          npx --yes skills@1.8.1 add "$SOURCE_REPOSITORY#$SOURCE_REF" --skill '*' --agent codex --copy --yes
          python -I -S .agents/skills/initialize-repo/scripts/initialize.py . --agents codex --no-hooks --ci none
      - name: Qualify native OpenSpec lifecycle and local-only new-project evolution
        env:
          DISABLE_TELEMETRY: '1'
        run: python tools/qualify_openspec.py --output "$RUNNER_TEMP/openspec-qualification.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-openspec-qualification
          path: |
            ${{ runner.temp }}/openspec-qualification.json
            ${{ runner.temp }}/claude-marketplace-qualification.json
          if-no-files-found: ignore
  behavior-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual C C++ Java Python boundary and regression probes
        run: python tools/qualify_behavior.py --output "$RUNNER_TEMP/behavior-probes"
      - name: Check source facts and assertion counterexamples
        run: python tools/qualify_source_facts.py --output "$RUNNER_TEMP/source-facts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-behavior-probes
          path: |
            ${{ runner.temp }}/behavior-probes
            ${{ runner.temp }}/source-facts
