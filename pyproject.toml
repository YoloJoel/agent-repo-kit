[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-repo-kit"
version = "0.2.0"
description = "Reusable skills, templates, hooks, and checks for AI-driven software development"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "agent-repo-kit contributors"}]
dependencies = []

[project.scripts]
ark = "agent_repo_kit.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_repo_kit = ["assets/**/*"]
